{% extends "base.html" %}
{% block titulo %}{{ 'Editar bem' if bem else 'Novo bem' }} &middot; Controle de Patrimônio{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h3 mb-0">{{ 'Editar bem' if bem else 'Novo bem' }}</h1>
            <a href="{{ url_for('bens') }}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Voltar
            </a>
        </div>
        <form method="post" class="card card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Código patrimonial *</label>
                    <input type="text" name="codigo" class="form-control" required
                           value="{{ bem.codigo if bem else '' }}">
                </div>
                <div class="col-md-8">
                    <label class="form-label">Nome *</label>
                    <input type="text" name="nome" class="form-control" required
                           value="{{ bem.nome if bem else '' }}">
                </div>
                <div class="col-12">
                    <label class="form-label">Descrição</label>
                    <textarea name="descricao" class="form-control" rows="3">{{ bem.descricao if bem else '' }}</textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Categoria</label>
                    <select name="categoria_id" class="form-select">
                        <option value="">Sem categoria</option>
                        {% for c in categorias %}
                            <option value="{{ c.id }}" {{ 'selected' if bem and bem.categoria_id == c.id }}>{{ c.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Local</label>
                    <select name="local_id" class="form-select">
                        <option value="">Sem local</option>
                        {% for l in locais %}
                            <option value="{{ l.id }}" {{ 'selected' if bem and bem.local_id == l.id }}>{{ l.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        {% for s in status_bem %}
                            <option value="{{ s }}" {{ 'selected' if bem and bem.status == s }}>{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Valor (R$)</label>
                    <input type="number" step="0.01" min="0" name="valor" class="form-control"
                           value="{{ bem.valor if bem else '0' }}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Data de aquisição</label>
                    <input type="date" name="data_aquisicao" class="form-control"
                           value="{{ bem.data_aquisicao if bem and bem.data_aquisicao else '' }}">
                </div>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4">
                <a href="{{ url_for('bens') }}" class="btn btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg me-1"></i>Salvar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
